# nginx.conf — Reverse proxy TLS para Financial Dashboard
# CHK025: HTTPS obrigatório; HTTP redireciona para HTTPS.
# Dev: certificado auto-assinado em /etc/nginx/tls/dev/
# Produção: substituir pelos caminhos do certificado real.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs estruturados (constitution P-I — auditabilidade)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Segurança: ocultar versão do nginx
    server_tokens off;

    # ─── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # NEVER expose HTTP — redirecionar tudo para HTTPS (CHK025)
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS reverse proxy ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Dev: certificado auto-assinado
        # Produção: substituir pelos caminhos do certificado real (Let's Encrypt ou CA)
        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;

        # TLS hardening — CHK025
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — nunca servir via HTTP após o primeiro HTTPS (max-age=1 ano)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Segurança adicional
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Proxy para o backend Go
        location / {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
